name: Test and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per branch or PR: a newer push cancels an older run of the same
# branch, but runs on different PRs (or on main) no longer cancel each other.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the rules core
        run: npm test
      - name: Install LilyPond
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lilypond
      - name: Build the site
        run: |
          mkdir -p _site/scores
          cp -r index.html assets src taneyev canon data _site/
          for f in scores/*.ly; do
            [ -e "$f" ] || continue
            lilypond -dbackend=svg -dno-point-and-click -o "_site/scores/$(basename "$f" .ly)" "$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
