<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The browser-tab icon: the canon in logo.svg, drawn smaller on an accent-colored tile so
       it stands out at 16 px. Light and dark follow the system. -->
  <style>
    .tile { fill: #1f5f6b; } .leader { fill: #f6f7f9; } .follower { fill: #a9dbe3; }
    @media (prefers-color-scheme: dark) { .tile { fill: #7cc3cf; } .leader { fill: #12161d; } .follower { fill: #2b6b76; } }
  </style>
  <rect class="tile" width="100" height="100" rx="22"/>
  <g class="leader">
    <ellipse cx="23" cy="38" rx="10" ry="7.5" transform="rotate(-22 23 38)"/>
    <ellipse cx="40" cy="25" rx="10" ry="7.5" transform="rotate(-22 40 25)"/>
    <ellipse cx="57" cy="35" rx="10" ry="7.5" transform="rotate(-22 57 35)"/>
  </g>
  <!-- the same three notes, moved 21 right and 37 down -->
  <g class="follower" transform="translate(21 37)">
    <ellipse cx="23" cy="38" rx="10" ry="7.5" transform="rotate(-22 23 38)"/>
    <ellipse cx="40" cy="25" rx="10" ry="7.5" transform="rotate(-22 40 25)"/>
    <ellipse cx="57" cy="35" rx="10" ry="7.5" transform="rotate(-22 57 35)"/>
  </g>
</svg>
