<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The browser-tab icon: the mark in logo.svg (two voices trading places) drawn on an
       accent-colored tile, so it stands out at 16 px. Light and dark follow the system. -->
  <style>
    .tile { fill: #1f5f6b; } .upper { stroke: #f6f7f9; } .lower { stroke: #a9dbe3; } .gap { stroke: #1f5f6b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #7cc3cf; } .upper { stroke: #12161d; } .lower { stroke: #2b6b76; } .gap { stroke: #7cc3cf; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="22"/>
  <g fill="none" stroke-linecap="round" stroke-width="10">
    <!-- lower voice, rising -->
    <path class="lower" d="M20,72 H32 C44,72 56,28 68,28 H80"/>
    <!-- tile-colored band where the upper voice crosses in front -->
    <path class="gap" stroke-width="20" stroke-linecap="butt" d="M44,42 C47,46 53,54 56,58"/>
    <!-- upper voice, falling -->
    <path class="upper" d="M20,28 H32 C44,28 56,72 68,72 H80"/>
  </g>
</svg>
