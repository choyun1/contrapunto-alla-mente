<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The browser-tab icon: the canon in logo.svg, drawn smaller on an ink tile so it stands out
       at 16 px in light and dark tabs alike. The leader is paper white, the follower the light
       indigo accent (assets/site.css). favicon-32.png and apple-touch-icon.png are copies of this
       drawing for browsers that don't show an SVG icon (Safari, and home-screen icons). -->
  <rect width="100" height="100" rx="22" fill="#191b2a"/>
  <g fill="#f7f7fa">
    <ellipse cx="23" cy="44" rx="10" ry="7.5" transform="rotate(-22 23 44)"/>
    <ellipse cx="40" cy="34" rx="10" ry="7.5" transform="rotate(-22 40 34)"/>
    <ellipse cx="57" cy="41" rx="10" ry="7.5" transform="rotate(-22 57 41)"/>
  </g>
  <g fill="#a3aef5" transform="translate(21 24)">
    <ellipse cx="23" cy="44" rx="10" ry="7.5" transform="rotate(-22 23 44)"/>
    <ellipse cx="40" cy="34" rx="10" ry="7.5" transform="rotate(-22 40 34)"/>
    <ellipse cx="57" cy="41" rx="10" ry="7.5" transform="rotate(-22 57 41)"/>
  </g>
</svg>
